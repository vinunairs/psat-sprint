<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PSAT Sprint</title>
<meta name="description" content="PSAT and SAT practice: fresh questions every time, timed adaptive mock tests, a skill matrix, and rewards.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1B2233">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PSAT Sprint">
<link rel="stylesheet" href="css/app.css?v=20260928f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23E6AE0B' stroke='%231B2233' stroke-width='4'/%3E%3C/svg%3E">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand"><i aria-hidden="true"></i><b>PSAT Sprint</b></div>
      <div class="hello" id="hello"></div>
      <div class="eyebrow" id="testLabel">PSAT/NMSQT · Wednesday, Oct 7</div>
      <div class="count"><b class="num" id="daysLeft">9</b><span id="daysLabel">days<em>to test day</em></span></div>
    </div>
    <div class="status">
      <div class="stat"><span class="eyebrow">Account</span><button type="button" id="syncBtn" class="syncchip off">Sign in to sync</button></div>
      <div class="stat"><span class="eyebrow">Streak</span><strong class="num" id="hStreak">0 days</strong></div>
      <div class="stat"><span class="eyebrow">Latest score</span><strong class="num" id="hScore">—</strong></div>
      <div class="stat xpbar"><span class="eyebrow" id="hLevel">Level 1 · Warm-Up</span>
        <div class="track" aria-hidden="true"><i id="hXpBar" style="width:0%"></i></div>
        <span class="num muted" style="font-size:12px" id="hXp">0 XP</span></div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="practice" aria-selected="false">Practice</button>
    <button role="tab" data-tab="mock" aria-selected="false">Mock test</button>
    <button role="tab" data-tab="matrix" aria-selected="false">Skill matrix</button>
    <button role="tab" data-tab="log" aria-selected="false">Log Bluebook test</button>
    <button role="tab" data-tab="rewards" aria-selected="false">Rewards</button>
  </nav>

  <main>
    <section class="panel" id="p-today"></section>
    <section class="panel" id="p-practice" hidden></section>
    <section class="panel" id="p-mock" hidden></section>
    <section class="panel" id="p-matrix" hidden></section>
    <section class="panel" id="p-log" hidden></section>
    <section class="panel" id="p-rewards" hidden></section>
  </main>

  <footer class="foot">
    <span>Progress saves on this device first, then to the account when signed in.</span>
    <span class="row" style="gap:8px">
      <button class="btn small ghost" id="exportBtn" type="button">Back up progress</button>
      <label class="btn small ghost" for="importFile">Restore from backup</label>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="btn small ghost" id="remindBtn" type="button">Reminders</button>
      <button class="btn small ghost" id="settingsBtn" type="button">Settings</button>
    </span>
  </footer>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="pop"></div>

<script src="js/vendor/supabase-2.117.2.js?v=20260928f"></script>
<script src="js/core.js?v=20260928f"></script>
<script src="js/mathgen.js?v=20260928f"></script>
<script src="js/mathgen2.js?v=20260928f"></script>
<script src="js/rwgen.js?v=20260928f"></script>
<script src="js/rwbank.js?v=20260928f"></script>
<script src="js/rwbank2.js?v=20260928f"></script>
<script src="js/app.js?v=20260928f"></script>
<script src="js/sync.js?v=20260928f"></script>
</body>
</html>
